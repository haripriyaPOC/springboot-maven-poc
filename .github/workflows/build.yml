
name: Java Application Build and Kubernetes Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          

      - name: Maven Clean Package
        run: mvn clean package

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/vam-backend:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/vam-backend:${{ github.sha }}

      - name: Diagnose Kubernetes API Connectivity
        run: |
          echo "Checking network routes..."
          ip route

          echo "Checking Kubernetes API port..."
          nc -vz -w 5 172.31.30.220 6443

          echo "Checking Kubernetes API readiness endpoint..."
          curl -k -v --connect-timeout 5 \
            https://172.31.30.220:6443/readyz

      - name: Configure Kubernetes
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          echo "Validating Kubernetes configuration..."
          kubectl config current-context

          echo "Checking Kubernetes cluster access..."
          kubectl get nodes

          echo "Deploying application..."
          kubectl apply -f deployment.yml
          kubectl apply -f service.yml

        
